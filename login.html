<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · JMBNR</title><link rel="stylesheet" href="site.css"></head><body><header class="bar"><div class="wrap"><a class="brand" href="index.html">JMBNR<small>GUILD NETWORK</small></a><nav class="nav" aria-label="Main"><a href="index.html">Home</a><a href="academy.html">Academy</a><a href="operations.html">Operations</a><a href="join.html">Join</a></nav></div></header><main><section class="section wrap" style="max-width:600px;padding-top:95px"><div class="label">Member access</div><h1 style="font-size:clamp(45px,7vw,76px);letter-spacing:-.06em;margin:15px 0">Welcome back.</h1><p class="copy">Sign in with your existing guild account to see your member area.</p><form class="box" id="login-form"><label class="field" for="username">Username or email</label><input id="username" class="input" autocomplete="username" required><label class="field" for="password">Password</label><input id="password" class="input" type="password" autocomplete="current-password" required><button class="btn" type="submit" id="submit">Sign in ↗</button><p id="status" class="feedback" role="status" aria-live="polite"></p></form><p class="copy">New to the crew? <a href="join.html" style="color:var(--bright)">Start here ↗</a></p></section></main><footer class="footer"><div class="wrap"><span>© JMBNR · Member access</span><a href="index.html">Return home ↑</a></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>
(async()=>{const status=document.getElementById('status'),params=new URLSearchParams(location.search);if(params.has('error'))status.textContent=params.get('error_description')||'Sign in failed.';try{const code=params.get('code');if(code){const {error}=await guildAuth.auth.exchangeCodeForSession(code);if(error)throw error;history.replaceState({},'',location.pathname)}if(await guildUser())location.replace('member.html')}catch(e){status.textContent=e.message||'Unable to check your session.'}})();
document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit'),status=document.getElementById('status');button.disabled=true;status.textContent='Signing in…';try{const input=document.getElementById('username').value.trim();const email=input.includes('@')?input:`${input}@jmbn.local`;const {error}=await guildAuth.auth.signInWithPassword({email,password:document.getElementById('password').value});if(error)throw error;location.replace('member.html')}catch(err){status.textContent=err.message||'Sign in failed.';button.disabled=false}});
</script></body></html>
